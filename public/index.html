<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Balance — личные финансы</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"></head><body><div id="root"></div><dialog id="editor"><form id="entry"><div class="row"><h2>Операция</h2><button type="button" id="close" class="quiet" aria-label="Закрыть">✕</button></div><input name="id" type="hidden"><label>Тип<select name="kind"><option value="expense">Расход</option><option value="income">Внешний доход</option><option value="internal">Свои счета</option><option value="refund">Возврат</option><option value="debt">Основной долг</option><option value="investment">Инвестиции</option></select></label><div class="row"><label>Сумма, ₽<input name="amount" type="number" step="0.01" required></label><label>Дата<input name="date" type="date" required></label></div><label>Категория<input name="category" list="cats" maxlength="80" required></label><label>Описание<input name="description" maxlength="500" required></label><label>Комментарий<textarea name="comment" maxlength="1000"></textarea></label><p class="muted">Для своих счетов и инвестиций: минус — списание, плюс — поступление.</p><button>Сохранить</button><p id="form-error" role="alert"></p></form></dialog><datalist id="cats"></datalist><div id="toast" role="status"></div><script type="module" src="/app.js"></script></body></html>
